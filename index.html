        </div>

        <footer class="footer">
            <p>Lungs Exposure Risk Visualizer v1.0 | Real-time air quality data from OpenWeatherMap API | Educational Tool</p>
        </footer>
    </div>

    <script>
        // Three.js 3D Lung Visualization
        let scene, camera, renderer, pollutantParticles, lungsModel, lungsHelper;
        let currentFillLevel = 0;

        function normalizeLungsModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            model.position.sub(center);

            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const desiredSize = 2.5;
            const scale = desiredSize / maxDim;
            model.scale.multiplyScalar(scale);

            model.rotation.x = Math.PI / 12;

            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
        }

        function initThreeJS() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            // Camera setup
            const canvas = document.getElementById('canvas');
            camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.z = 3;

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // Create pollutant particles
            createPollutantParticles();

            // Load external lungs model
            loadLungsModel();

            // Animation loop
            animate();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }

        function loadLungsModel() {
            const loader = new THREE.GLTFLoader();
            loader.load(
                '/static/models/lungs.glb',
                (gltf) => {
                    const model = gltf.scene;
                    normalizeLungsModel(model);
                    lungsModel = model;
                    scene.add(lungsModel);
                    lungsHelper = new THREE.BoxHelper(lungsModel, 0xff0000);
                    scene.add(lungsHelper);
                    console.log('Model loaded successfully');
                    // Apply latest fill color to loaded model
                    updateLungFill(currentFillLevel);
                },
                undefined,
                (error) => {
                    console.error('Model failed to load:', error);
                    // Graceful fallback so user still sees lungs
                    createProceduralLungs();
                }
            );
        }

        function createProceduralLungs() {
            const lungMaterial = new THREE.MeshPhongMaterial({
                color: 0x06b6d4,
                emissive: 0x062e3a,
                shininess: 100
            });

            const leftGeometry = new THREE.LatheGeometry(
                [
                    new THREE.Vector2(0, 0),
                    new THREE.Vector2(0.8, 0.2),
                    new THREE.Vector2(0.9, 0.8),
                    new THREE.Vector2(0.7, 1.5),
                    new THREE.Vector2(0.3, 1.8),
                    new THREE.Vector2(0.1, 1.5),
                    new THREE.Vector2(0, 0.8)
                ],
                32
            );

            const rightGeometry = new THREE.LatheGeometry(
                [
                    new THREE.Vector2(0, 0),
                    new THREE.Vector2(0.95, 0.2),
                    new THREE.Vector2(1.0, 0.8),
                    new THREE.Vector2(0.8, 1.5),
                    new THREE.Vector2(0.35, 1.8),
                    new THREE.Vector2(0.1, 1.5),
                    new THREE.Vector2(0, 0.8)
                ],
                32
            );

            lungsModel = new THREE.Group();
            const leftLung = new THREE.Mesh(leftGeometry, lungMaterial.clone());
            leftLung.position.x = -1.2;
            leftLung.scale.set(0.7, 1, 0.7);

            const rightLung = new THREE.Mesh(rightGeometry, lungMaterial.clone());
            rightLung.position.x = 1.2;
            rightLung.scale.set(0.8, 1, 0.8);

            const tracheaGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 16);
            const tracheaMaterial = new THREE.MeshPhongMaterial({ color: 0x10b981 });
            const trachea = new THREE.Mesh(tracheaGeometry, tracheaMaterial);
            trachea.position.y = 1.2;

            lungsModel.add(leftLung, rightLung, trachea);
            scene.add(lungsModel);
        }

        function createPollutantParticles() {
            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = 500;

            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 4;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 4;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 4;

                velocities[i * 3] = (Math.random() - 0.5) * 0.02;
                velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.02;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.userData.velocity = velocities;

            const particleMaterial = new THREE.PointsMaterial({
                color: 0xef4444,
                size: 0.05,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true
            });

            pollutantParticles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(pollutantParticles);
        }

        function updateLungFill(fillLevel) {
            currentFillLevel = fillLevel;
            if (lungsModel) {
                let colorHex = 0x10b981;
                if (fillLevel >= 75) {
                    colorHex = 0x991b1b;
                } else if (fillLevel >= 50) {
                    colorHex = 0xef4444;
                } else if (fillLevel >= 25) {
                    colorHex = 0xf59e0b;
                }
                lungsModel.traverse((child) => {
                    if (child.isMesh && child.material && child.material.color) {
                        child.material.color.setHex(colorHex);
                    }
                });
            }

            // Update particle opacity based on fill
            pollutantParticles.material.opacity = 0.2 + (fillLevel / 100) * 0.6;

            // Update UI
            document.getElementById('fillPercent').textContent = Math.round(fillLevel) + '%';
            const lungFill = document.getElementById('lungFill');
            lungFill.style.width = fillLevel + '%';
            lungFill.textContent = fillLevel > 5 ? Math.round(fillLevel) + '%' : '';
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate lungs
            if (lungsModel) {
                lungsModel.rotation.y += 0.003;
                if (lungsHelper) {
                    lungsHelper.update();
                }
            }

            // Update particles
            const positions = pollutantParticles.geometry.attributes.position.array;
            const velocities = pollutantParticles.geometry.userData.velocity;

            for (let i = 0; i < positions.length; i += 3) {
                positions[i] += velocities[i];
                positions[i + 1] += velocities[i + 1];
                positions[i + 2] += velocities[i + 2];

                // Bounce particles
                if (Math.abs(positions[i]) > 2) velocities[i] *= -1;
                if (Math.abs(positions[i + 1]) > 2) velocities[i + 1] *= -1;
                if (Math.abs(positions[i + 2]) > 2) velocities[i + 2] *= -1;
            }

            pollutantParticles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const canvas = document.getElementById('canvas');
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // Application logic
        async function fetchCities() {
            try {
                const response = await fetch('/api/cities');
                const cities = await response.json();
                const cityButtons = document.getElementById('cityButtons');
                
                cities.forEach(city => {
                    const btn = document.createElement('button');
                    btn.textContent = city.name;
                    btn.className = 'city-btn';
                    btn.onclick = () => selectCity(city, btn);
                    cityButtons.appendChild(btn);
                });
            } catch (error) {
                console.error('Error fetching cities:', error);
            }
        }

        function selectCity(city, btnElement) {
            // Update active state
            document.querySelectorAll('.city-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            // Fetch data for this city
            fetchLiveDataForCity(city.lat, city.lon);
        }

        async function fetchLiveDataForCity(lat, lon) {
            document.getElementById('loading').style.display = 'block';
            try {
                const response = await fetch(`/api/air-quality?lat=${lat}&lon=${lon}`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('aqi').value = Math.round(data.aqi);
                    document.getElementById('pm25').value = Math.round(data.pm25 * 100) / 100;
                    document.getElementById('loading').style.display = 'none';
                    calculateExposure();
                } else {
                    alert('Error fetching air quality data. Using default values.');
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to fetch real-time data. Using default values.');
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function fetchLiveData() {
            // Use geolocation or default to Delhi
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        fetchLiveDataForCity(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        // Default to Delhi
                        fetchLiveDataForCity(28.6139, 77.2090);
                    }
                );
            } else {
                // Default to Delhi
                fetchLiveDataForCity(28.6139, 77.2090);
            }
        }

        async function calculateExposure() {
            const aqi = parseInt(document.getElementById('aqi').value) || 100;
            const activity = document.getElementById('activity').value;
            const duration = parseInt(document.getElementById('duration').value) || 60;

            try {
                const response = await fetch('/api/calculate-exposure', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aqi, activity, duration })
                });

                const data = await response.json();

                if (data.success) {
                    // Update PM2.5 field
                    document.getElementById('pm25').value = data.pm25;

                    // Update 3D visualization
                    updateLungFill(data.lung_fill_percentage);

                    // Update risk indicator
                    const riskIndicator = document.getElementById('riskIndicator');
                    riskIndicator.className = 'risk-indicator ' + data.risk_level.toLowerCase().replace(/\s+/g, '-');
                    document.getElementById('riskLevel').textContent = data.risk_level;
                    document.getElementById('riskAdvice').textContent = data.health_advice;

                    // Update stats
                    document.getElementById('resultPM25').textContent = data.pm25 + ' µg/m³';
                    document.getElementById('resultBreathRate').textContent = data.breathing_rate + ' m³/h';
                    document.getElementById('resultExposure').textContent = data.total_exposure_micrograms + ' µg';
                    document.getElementById('resultRiskLevel').textContent = data.risk_level;

                    // Health insight
                    const insight = `In ${duration} minutes of ${activity}, you'll inhale ~${data.total_exposure_micrograms}µg of pollutants. ${data.health_advice}`;
                    document.getElementById('healthInsight').textContent = insight;

                    // Show results
                    document.getElementById('results').style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Calculation error. Please try again.');
            }
        }

        // Initialize
        window.addEventListener('load', () => {
            initThreeJS();
            fetchCities();
            calculateExposure(); // Initial calculation
        });
    </script>
</body>
</html>
